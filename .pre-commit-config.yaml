repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-toml
    -   id: check-added-large-files
    -   id: debug-statements

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
    -   id: ruff-check
        args: [--fix]
    -   id: ruff-format

-   repo: local
    hooks:
    # Usa el entorno del proyecto (uv) para que mypy vea las mismas
    # dependencias y tipos que en la CI
    -   id: mypy
        name: mypy
        entry: uv run mypy pypex
        language: system
        types: [python]
        files: ^pypex/
        pass_filenames: false
