[tool.poetry]
name = "pypex"
version = "0.1.0"
description = "Analizador de Complejidad de Código para Python"
authors = ["Alejandro Penalba <apenalbatarrida@gmail.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/APenalba/TFG"
packages = [
    { include = "pypex" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry.dependencies]
python = "^3.12"
astroid = "^4.3.4"
click = "^8.5.0"
rich = "^15.0.0"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
black = "^26.10.1"
flake8 = "^7.4.1"
mypy = "^2.4.0"
isort = "^9.0.2"
pre-commit = "^4.7.0"
autoflake = "^2.4.0"

[tool.poetry.scripts]
pypex = "pypex.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
# Temporarily remove for our initial tests
addopts = "--cov=pypex --cov-report=term-missing --cov-report=html"
