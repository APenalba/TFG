[project]
name = "pypex"
version = "0.1.0"
description = "Analizador de Complejidad de Código para Python"
authors = [{ name = "Alejandro Penalba", email = "apenalbatarrida@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "astroid>=4.3.4,<5",
    "click>=8.5.0,<9",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/APenalba/TFG"

[project.scripts]
pypex = "pypex.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "types-pyyaml",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # el formateador controla la longitud; quedan textos y HTML largos
    "UP040",  # TypeAlias se mantiene: los alias con `type` no sirven en isinstance()
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=pypex --cov-report=term-missing"
# Las deprecaciones de dependencias fallan los tests para detectarlas pronto
filterwarnings = ["error"]
